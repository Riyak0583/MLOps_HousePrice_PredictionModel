# Central configuration: edit this instead of touching code.
data:
  path: "C:\MLOPs_HousePrice_PredictionModel\data\raw\house_price_prediction_dataset.csv"       # CSV used for training
  target: price               # name of the label column
  test_size: 0.3
  random_state: 1

model:
  type: random_forest           # random_forest | logistic_regression
  params:
    n_estimators: 100
    max_depth: 5

artifacts:
  model_dir: models             # versioned models are saved here
  report_dir: reports           # metrics JSON files are saved here
